# Every push and pull request: lint, TypeScript, the unit tests and a
# production build. No secrets: the build and the unit tests need none.
# The black-box security suite needs running services: see security.yml.
name: CI

on:
  push:
    branches: [main, modernize-stack]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -- --quiet
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
